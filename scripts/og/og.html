<!doctype html>
<!--
  사이트 공용 공유 이미지(public/og/default.png, 1200×630)의 원본. render-og.cjs가 Edge로 캡처한다.
  DESIGN.md 시각 언어: 흰 바탕, Pretendard, 정체성 문장의 키워드 3개는 primary + primary-tint 밑줄 띠.
  점-선-점 모티프는 내비·섹션 라벨 전용이라 쓰지 않는다(DESIGN.md Do's and Don'ts).
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>OG default</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"
    />
    <style>
      /* DESIGN.md 토큰 일부(src/styles/tokens.css와 같은 값) */
      :root {
        --surface-base: #ffffff;
        --ink-primary: #1c2333;
        --ink-secondary: #4b5566;
        --ink-tertiary: #677182;
        --primary: #406abf;
        --primary-tint: #dfe7f6;
        --border-hairline: #e4e8ee;
        --border-strong: #ced5df;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        background: var(--surface-base);
        color-scheme: light;
      }

      body {
        font-family: 'Pretendard Variable', Pretendard, sans-serif;
        word-break: keep-all;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overflow: hidden;
      }

      .frame {
        width: 1200px;
        height: 630px;
        padding: 0 96px;
        display: flex;
        flex-direction: column;
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 24px;
      }

      /* label 토큰을 OG 크기로 키움(13px → 22px, 600, 0.08em) */
      .eyebrow {
        font-size: 22px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: 0.08em;
        color: var(--ink-secondary);
      }

      .eyebrow .dot {
        display: inline-block;
        width: 14px;
        text-align: center;
        margin-inline: 4px;
        letter-spacing: 0;
        color: var(--border-strong);
      }

      .url {
        font-size: 22px;
        font-weight: 500;
        line-height: 1.4;
        color: var(--ink-tertiary);
      }

      /* display 토큰 비율 그대로(700, 1.22, -0.03em), 크기만 키움 */
      h1 {
        margin-top: 36px;
        font-size: 74px;
        font-weight: 700;
        line-height: 1.22;
        letter-spacing: -0.03em;
        color: var(--ink-primary);
      }

      h1 .line {
        display: block;
      }

      .kw {
        color: var(--primary);
        white-space: nowrap;
        background: linear-gradient(
          transparent 74%,
          var(--primary-tint) 74%,
          var(--primary-tint) 92%,
          transparent 92%
        );
      }

      .foot {
        display: flex;
        align-items: center;
        height: 104px;
        border-top: 1px solid var(--border-hairline);
      }

      /* 히어로의 세 가지 강점(문구는 그대로, 구분점은 border-strong) */
      .strengths {
        font-size: 22px;
        font-weight: 500;
        line-height: 1.5;
        white-space: nowrap;
        color: var(--ink-secondary);
      }

      .strengths .sep {
        margin-inline: 12px;
        color: var(--border-strong);
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="main">
        <div class="top">
          <p class="eyebrow">안서진<span class="dot">·</span><span lang="en">FRONTEND DEVELOPER</span></p>
          <p class="url">xxj15.github.io/anseojin-portfolio</p>
        </div>
        <h1>
          <span class="line"><span class="kw">기획</span>과 <span class="kw">UI/UX 디자인</span>을 이해하고,</span>
          <span class="line"><span class="kw">사용자 경험</span>과 흐름을 설계하는</span>
          <span class="line">프론트엔드 개발자</span>
        </h1>
      </div>
      <div class="foot">
        <p class="strengths">
          사용자 관점의 흐름 설계<span class="sep">·</span>기획부터 개발까지 직접 연결<span class="sep">·</span>아이디어를 실제 서비스로 완성
        </p>
      </div>
    </div>
  </body>
</html>
